<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>La Vista — Order Online</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0b0b0b;color:#f6ecdf;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,11,.95);backdrop-filter:blur(12px);border-bottom:1px solid #3a2e1d}
.hero{padding:20px 16px 14px;text-align:center;background:radial-gradient(circle at 50% 0,#3b2b16 0,#0b0b0b 55%)}
.logo{font-family:Georgia,serif;color:#d1aa65;font-size:38px;letter-spacing:1px}.tag{font-size:12px;color:#cbbda9;letter-spacing:2px}
.search{margin:12px auto 4px;max-width:620px;display:flex;gap:8px}.search input{flex:1;padding:13px 15px;border-radius:14px;border:1px solid #4a3b26;background:#171717;color:white;font-size:15px}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 14px;scrollbar-width:none}.chips button{white-space:nowrap;border:1px solid #4a3b26;background:#161616;color:#e7d8c3;border-radius:999px;padding:9px 13px}.chips button.active{background:#c8a15a;color:#111}
main{max-width:720px;margin:auto;padding:10px 14px 120px}.section{margin:18px 0}.section h2{font-family:Georgia,serif;color:#d1aa65;font-size:23px;margin:0 0 10px;border-bottom:1px solid #352918;padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#151515;border:1px solid #29231a;border-radius:15px;padding:12px;display:flex;flex-direction:column;min-height:118px}.name{font-weight:650;font-size:14px;line-height:1.25}.price{color:#d1aa65;font-weight:700;margin-top:6px}.muted{color:#8f867a;font-size:11px}.add{margin-top:auto;width:100%;border:1px solid #c8a15a;background:transparent;color:#e7c98f;border-radius:10px;padding:9px;font-weight:700}.add:active{transform:scale(.98)}
.cart{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:#d1aa65;color:#111;border:0;border-radius:16px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;box-shadow:0 10px 35px #000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#121212;border-top:1px solid #4b3b25;width:100%;max-height:86vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.sheet h3{font-family:Georgia,serif;color:#d1aa65;font-size:24px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #29231a;padding:10px 0}.qty{display:flex;gap:8px;align-items:center}.qty button{width:30px;height:30px;border-radius:9px;border:1px solid #54452d;background:#1d1d1d;color:#fff}.customer input,.customer textarea{width:100%;padding:11px;margin:5px 0 8px;border-radius:10px;border:1px solid #453821;background:#181818;color:white}.checkout{width:100%;padding:13px;border:0;border-radius:12px;background:#25d366;color:#08140c;font-weight:900;font-size:16px}.close{float:right;background:none;border:0;color:#ddd;font-size:22px}
.notice{font-size:11px;color:#9d9488;line-height:1.5;margin-top:10px}.empty{padding:25px;text-align:center;color:#9d9488}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.sheet{width:650px;margin:auto;border-radius:20px;margin-bottom:15px}}
</style>
</head>
<body>
<header><div class="hero"><div class="logo">La Vista</div><div class="tag">MULTICUISINE RESTAURANT</div><div class="search"><input id="search" placeholder="Search dishes…" oninput="render()"></div></div><div class="chips" id="chips"></div></header>
<main id="menu"></main>
<button class="cart" onclick="openCart()"><span>🛒 View Order</span><span id="cartCount">0 • ₹0</span></button>

<div class="modal" id="modal" onclick="if(event.target===this)closeCart()"><div class="sheet">
<button class="close" onclick="closeCart()">✕</button><h3>Your Order</h3><div id="cartItems"></div>
<div class="customer"><label>Name</label><input id="custName" placeholder="Your name"><label>Phone</label><input id="custPhone" placeholder="Your phone number"><label>Order type</label><select id="orderType" style="width:100%;padding:11px;margin:5px 0 8px;border-radius:10px;background:#181818;color:white;border:1px solid #453821"><option>Takeaway</option><option>Table order</option><option>Delivery</option></select><label>Address / Table No.</label><textarea id="custAddress" rows="2" placeholder="Address or table number"></textarea></div>
<div style="display:flex;justify-content:space-between;font-weight:900;font-size:18px;padding:10px 0"><span>Total</span><span id="total">₹0</span></div>
<button class="checkout" onclick="sendOrder()">Send Order on WhatsApp</button>
<div class="notice">This demo sends the order to the restaurant's WhatsApp number. Replace the WhatsApp number in the code before publishing.</div>
</div></div>

const WA_NUMBER="917006323363"; // La Vista: 070063 23363 — verify before publishing.
let cart={};
let active="All";

function money(n){return "₹"+Number(n).toLocaleString("en-IN")}
function id(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"_")}
function renderChips(){
 const el=document.getElementById("chips");
 el.innerHTML=["All",...MENU.map(x=>x[0])].map(c=>`<button class="${active===c?'active':''}" onclick="active=${JSON.stringify(c)};render()">${c}</button>`).join("");
}
function render(){
 renderChips();
 const q=document.getElementById("search").value.toLowerCase();
 const sections=active==="All"?MENU:MENU.filter(x=>x[0]===active);
 let out="";
 for(const [cat,items] of sections){
   const filtered=items.filter(([n])=>n.toLowerCase().includes(q));
   if(!filtered.length)continue;
   out+=`<section class="section"><h2>${cat}</h2><div class="grid">`;
   filtered.forEach(([name,price],i)=>{
      const key=id(cat+"_"+name);
      out+=`<div class="card">${IMGS.length?`<img src="${IMGS[(i+MENU.findIndex(x=>x[0]===cat))%IMGS.length]}" style="width:100%;height:82px;object-fit:cover;border-radius:10px;margin-bottom:8px">`:''}
      <div class="name">${name}</div><div class="price">${price?money(price):'<span class="muted">Price to confirm</span>'}</div>
      <button class="add" onclick='add(${JSON.stringify(key)},${JSON.stringify(cat)},${JSON.stringify(name)},${JSON.stringify(price)})'>ADD</button></div>`;
   });
   out+="</div></section>";
 }
 document.getElementById("menu").innerHTML=out||'<div class="empty">No dishes found.</div>';
 updateCart();
}
function add(key,cat,name,price){if(!price){alert("This item's price needs to be confirmed by La Vista.");return}cart[key]??={cat,name,price:Number(price),qty:0};cart[key].qty++;updateCart()}
function change(key,d){if(!cart[key])return;cart[key].qty+=d;if(cart[key].qty<=0)delete cart[key];updateCart();openCart()}
function updateCart(){
 let count=0,total=0;Object.values(cart).forEach(x=>{count+=x.qty;total+=x.qty*x.price});
 document.getElementById("cartCount").textContent=`${count} • ${money(total)}`;
}
function openCart(){
 let h="";let total=0;
 for(const [key,x] of Object.entries(cart)){total+=x.qty*x.price;h+=`<div class="row"><div><b>${x.name}</b><div class="muted">${x.cat} • ${money(x.price)} each</div></div><div class="qty"><button onclick="change(${JSON.stringify(key)},-1)">−</button><b>${x.qty}</b><button onclick="change(${JSON.stringify(key)},1)">+</button></div></div>`}
 document.getElementById("cartItems").innerHTML=h||'<div class="empty">Your order is empty. Add dishes from the menu.</div>';
 document.getElementById("total").textContent=money(total);
 document.getElementById("modal").classList.add("open");
}
function closeCart(){document.getElementById("modal").classList.remove("open")}
function sendOrder(){
 if(!Object.keys(cart).length){alert("Add at least one item.");return}
 const name=document.getElementById("custName").value.trim();
 const phone=document.getElementById("custPhone").value.trim();
 const type=document.getElementById("orderType").value;
 const address=document.getElementById("custAddress").value.trim();
 let total=0,lines=[];
 for(const x of Object.values(cart)){total+=x.qty*x.price;lines.push(`• ${x.name} x${x.qty} = ${money(x.qty*x.price)}`)}
 let msg=`*LA VISTA — NEW ORDER*%0A%0A${lines.join("%0A")}%0A%0A*Total: ${money(total)}*%0A%0AName: ${encodeURIComponent(name||"Not provided")}%0APhone: ${encodeURIComponent(phone||"Not provided")}%0AOrder type: ${encodeURIComponent(type)}%0AAddress/Table: ${encodeURIComponent(address||"Not provided")}`;
 window.open(`https://wa.me/${WA_NUMBER}?text=${msg}`,"_blank");
}
render();
</script>
</body></html>
